[package]
name = "chube"
version = "0.1.0"
edition = "2024"
description = "Gerenciador de sessões do Claude Code e do Codex (aqui e numa VPS) para o Omarchy"
license = "GPL-3.0-only"

[dependencies]
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_18"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
vte4 = { version = "0.10", features = ["v0_78"] }

[profile.release]
lto = "thin"
